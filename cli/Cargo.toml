[package]
name = "depos"
version = "0.5.4"
edition = "2021"
description = "Shared dependency workspace CLI"
authors = ["Victor Stewart"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/victorstewart/depos"
homepage = "https://github.com/victorstewart/depos"

[[bin]]
name = "depos"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
metalor = "0.3.2"
sha2 = "0.10"
unicode-normalization = "0.1"
zip = { version = "7.2", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
tar = "0.4"
tempfile = "3.10"
